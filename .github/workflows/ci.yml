name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"

# release job 需要创建 Release（生成 release notes / 上传 exe）：
# 显式声明写权限，并配合仓库 Settings → Actions → Workflow permissions 设为
# "Read and write permissions"（仓库级别默认 read-only 会覆盖这里）。
permissions:
  contents: write

jobs:
  test:
    name: Test & security scan
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Security scan (full tree)
        run: python tools/check_secrets.py --all
      - name: Run tests
        run: python -m pytest

  build:
    name: Build exe
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # 完整历史 + tags：release notes 需要 git log prev..HEAD
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.21.0
      - name: Build DesktopPet.exe
        run: python -m PyInstaller --noconfirm --clean DesktopPet.spec
      - name: Verify no secrets leaked into dist
        shell: pwsh
        run: |
          if (Test-Path dist\DesktopPet\characters\amiya\ai_config.json) {
            Write-Error "ai_config.json leaked into dist!"
            exit 1
          }
          if (Get-ChildItem dist\DesktopPet\characters -Recurse -Directory -Filter ".claude") {
            Write-Error ".claude leaked into dist!"
            exit 1
          }
          Write-Host "dist clean"
      - name: Trim bundled characters (zip/installer 只保留一份素材)
        shell: pwsh
        run: Remove-Item dist\DesktopPet\_internal\characters -Recurse -Force
      - name: Package zip (onedir)
        shell: pwsh
        run: Compress-Archive -Path dist\DesktopPet\* -DestinationPath DesktopPet-onedir.zip -Force
      - name: Build installer (Inno Setup)
        shell: pwsh
        env:
          MY_APP_VERSION: dev
        run: |
          choco install innosetup -y --no-progress
          # ISCC 7 路径优先，其次 6，最后 PATH；/D(6) 与 -d(7) 语法不同需按版本选择
          $iscc = @("C:\Program Files (x86)\Inno Setup 7\ISCC.exe",
                    "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") |
                  Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            $cmd = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if ($cmd) { $iscc = $cmd.Source } else { throw "ISCC.exe not found" }
          }
          $head = (& $iscc /? 2>&1 | Select-Object -First 1)
          $flag = if ($head -match "Inno Setup 7") { "-dMyAppVersion=" } else { "/DMyAppVersion=" }
          Write-Host "Using $iscc :: $head"
          & $iscc "installer\DesktopPet.iss" "$flag$env:MY_APP_VERSION"
      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: DesktopPet-dist
          path: |
            DesktopPet-onedir.zip
            dist/DesktopPet-Setup-*.exe
          if-no-files-found: error

  release:
    name: Release (tag)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # 完整历史 + tags：release notes 需要 git log prev..HEAD
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.21.0
      - name: Build DesktopPet.exe
        run: python -m PyInstaller --noconfirm --clean DesktopPet.spec
      - name: Trim bundled characters (zip/installer 只保留一份素材)
        shell: pwsh
        run: Remove-Item dist\DesktopPet\_internal\characters -Recurse -Force
      - name: Package zip (onedir)
        shell: pwsh
        run: Compress-Archive -Path dist\DesktopPet\* -DestinationPath DesktopPet-onedir.zip -Force
      - name: Build installer (Inno Setup)
        shell: pwsh
        env:
          MY_APP_VERSION: ${{ github.ref_name }}
        run: |
          choco install innosetup -y --no-progress
          # ISCC 7 路径优先，其次 6，最后 PATH；/D(6) 与 -d(7) 语法不同需按版本选择
          $iscc = @("C:\Program Files (x86)\Inno Setup 7\ISCC.exe",
                    "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") |
                  Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            $cmd = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if ($cmd) { $iscc = $cmd.Source } else { throw "ISCC.exe not found" }
          }
          $head = (& $iscc /? 2>&1 | Select-Object -First 1)
          $flag = if ($head -match "Inno Setup 7") { "-dMyAppVersion=" } else { "/DMyAppVersion=" }
          Write-Host "Using $iscc :: $head"
          & $iscc "installer\DesktopPet.iss" "$flag$env:MY_APP_VERSION"
      - name: Prepare release notes
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $body = ""
          # 1) 优先从 CHANGELOG.md 提取与 tag 匹配的段落（## [vX.Y.Z] ... 到下一个 ## [）
          if (Test-Path CHANGELOG.md) {
            $raw = Get-Content CHANGELOG.md -Raw
            $esc = [regex]::Escape($tag)
            $m = [regex]::Match($raw, "(?s)## \[$esc\].*?(?=\n## \[|\z)")
            if ($m.Success) { $body = $m.Value.Trim() }
          }
          # 2) 找不到该版本段落 -> 从提交历史自动生成
          if (-not $body) {
            $prev = git describe --abbrev=0 --tags (git rev-list --tags --skip=1 --max-count=1) 2>$null
            if ($prev) { $range = "$prev..HEAD" } else { $range = "HEAD" }
            $log = git log $range --pretty=format:"- %s" --no-merges
            $body = "## $tag`n`n### 提交`n" + $log
          }
          Set-Content -Path release_body.md -Value $body -Encoding UTF8
          Write-Host "release notes ready ($($body.Length) chars)"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/DesktopPet-Setup-*.exe
            DesktopPet-onedir.zip
          body_path: release_body.md
          generate_release_notes: false
          # v3 默认支持更新已存在的 Release（重跑会刷新正文/附件），无需 allowUpdates
